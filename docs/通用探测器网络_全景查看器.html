<script>
const vp=document.getElementById("viewport"),svg=vp.querySelector("svg");
let scale=1,tx=0,ty=0;
function apply(){svg.style.transformOrigin="0 0";svg.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;document.getElementById("lvl").textContent=Math.round(scale*100)+"%";}
function fit(){const r=vp.getBoundingClientRect(),sw=parseFloat(svg.getAttribute("width")),sh=parseFloat(svg.getAttribute("height"));scale=Math.min(r.width/sw,r.height/sh);tx=(r.width-sw*scale)/2;ty=(r.height-sh*scale)/2;svg.setAttribute("width",sw);svg.setAttribute("height",sh);apply();}
document.getElementById("zin").onclick=()=>{scale*=1.25;apply()};
document.getElementById("zout").onclick=()=>{scale/=1.25;apply()};
document.getElementById("reset").onclick=fit;
vp.addEventListener("wheel",e=>{e.preventDefault();const r=vp.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,k=e.deltaY<0?1.15:1/1.15;tx=mx-(mx-tx)*k;ty=my-(my-ty)*k;scale*=k;apply()},{passive:false});
let drag=null;
vp.addEventListener("mousedown",e=>{drag={x:e.clientX-tx,y:e.clientY-ty};vp.classList.add("dragging")});
window.addEventListener("mousemove",e=>{if(drag){tx=e.clientX-drag.x;ty=e.clientY-drag.y;apply()}});
window.addEventListener("mouseup",()=>{drag=null;vp.classList.remove("dragging")});
fit();
</script>
